# Settings for the locked Vercel CLI, used only by the landing deploy workflow.

# Only install versions published at least 7 days ago (in minutes).
minimumReleaseAge: 10080
# The trust-downgrade check stays on for the landing page but not here. Since
# August 2026 (vercel 58.5.1) Vercel publishes the CLI and every @vercel/*
# package through npm trusted publishing from its GitHub Actions, without the
# provenance attestation earlier releases carried, so the check rejects every
# current release. The exact pin and the lockfile's integrity hashes still
# fix what gets installed.
trustPolicy: off
# Every dependency must come from the registry, never a git URL or tarball.
blockExoticSubdeps: true
# No dependency may run install scripts.
strictDepBuilds: true
# esbuild only checks its binary after install; its platform package is enough.
allowBuilds:
  esbuild: false

# Replace exact upstream pins only at the consumers covered by compatibility tests.
# API compatibility coverage lives in compatibility.test.mjs.
overrides:
  'tar@7.5.11': 7.5.22
  # Glob 14 and Minimatch 11 must move together; Glob 13 uses regex internals.
  '@vercel/nft@1.10.0>glob': 14.0.3
  # Python analysis only uses match(list, pattern), retained by Minimatch 11.
  '@vercel/python-analysis@0.15.3>minimatch': 11.0.4
  'ajv@8.6.3': 8.20.0
  'js-yaml@4.1.1': 4.3.2
  'smol-toml@1.5.2': 1.9.1
  'path-to-regexp@6.1.0': 6.3.0
  'path-to-regexp@8.3.0': 8.4.2
  'undici@5.28.4': 5.29.0
