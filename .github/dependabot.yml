# Weekly updates, each version at least 7 days old, matching the rule for
# every dependency in this repo. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/landing
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: build
    groups:
      landing:
        patterns: ["*"]
    # astro check does not support TypeScript 7 yet.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /.github/vercel
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: ci
