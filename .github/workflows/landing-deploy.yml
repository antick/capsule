name: Deploy landing page

# Deploys the latest stable release's landing page to capsule.potion.sh.
#
# The Release workflow calls this once a release is public. Run it by hand to
# redeploy the latest release, or explicitly choose main for website-only updates.
# Vercel's own Git deployments are off in apps/landing/vercel.json.
#
# The page is built here, from the release tag with the locked toolchain, and
# only the finished files are uploaded. The Vercel token lives in the
# `landing` environment, which only main and v* tags may use.
on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
  workflow_dispatch:
    inputs:
      deploy_main:
        description: Deploy the website from main without a desktop release
        type: boolean
        default: false

permissions: {}

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to capsule.potion.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: landing
      url: https://capsule.potion.sh
    permissions:
      contents: read # check out the code and read the latest release
    steps:
      - name: Select the deployment source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_MAIN: ${{ inputs.deploy_main }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$DEPLOY_MAIN" == true ]]; then
            if [[ "$SOURCE_REF" != refs/heads/main ]]; then
              echo "Website-only deployments must run from main." >&2
              exit 1
            fi
            echo "ref=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh release view` with no tag returns the release marked Latest,
          # which is never a draft or a prerelease.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable release tag: $tag" >&2
            exit 1
          fi
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the source is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Check the release includes the landing page
        run: |
          if [ ! -f apps/landing/package.json ]; then
            echo "::error::This release predates apps/landing. The page deploys with the next release."
            exit 1
          fi

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.15
          sha256: 09ea631d6f3e7031d63606a0892dc4c796f9fb57f493bc45937f9f7113c88216
          install_args: node pnpm
          cache: false

      - name: Check the landing page
        run: mise run landing:check

      - name: Install the Vercel CLI from its lockfile
        working-directory: .github/vercel
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and deploy
        working-directory: apps/landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "The landing environment has no $name secret." >&2
              exit 1
            fi
          done
          vercel=../../.github/vercel/node_modules/.bin/vercel
          "$vercel" pull --yes --environment=production
          "$vercel" build --prod
          "$vercel" deploy --prebuilt --prod --yes
