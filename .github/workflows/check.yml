name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Capsule is a macOS app, built with Swift Package Manager.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version
      - run: swift build
      - run: scripts/test-all.sh

      # A crashed test process leaves its report here; print the crashing
      # thread so the failure can be read from the log.
      - name: Show test crash reports
        if: failure()
        run: |
          for report in ~/Library/Logs/DiagnosticReports/CapsulePackageTests*; do
            [ -e "$report" ] || continue
            echo "== $report"
            head -c 20000 "$report"
          done
      - run: scripts/test-scripts.sh
      - run: scripts/bundle-macos.sh release
