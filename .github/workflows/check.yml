name: Check

# Builds and tests the app. Changes only to the landing page skip it; the
# Landing workflow covers those.
on:
  push:
    branches: [main]
    paths-ignore: ["apps/landing/**"]
  pull_request:
    paths-ignore: ["apps/landing/**"]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Capsule is a macOS app, built with Swift Package Manager.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - run: swift --version
      - run: swift build
      - run: scripts/test-all.sh

      # The runner keeps no crash reports, so a crashed test target is run
      # again under lldb to print where it died.
      - name: Backtrace a crashed test target
        if: failure()
        run: |
          helper="$(dirname "$(xcrun -f swift)")/../libexec/swift/pm/swiftpm-testing-helper"
          bundle=".build/arm64-apple-macosx/debug/CapsulePackageTests.xctest/Contents/MacOS/CapsulePackageTests"
          frameworks="$(xcrun --show-sdk-platform-path)/Developer/Library/Frameworks"
          libraries="$(xcrun --show-sdk-platform-path)/Developer/usr/lib"
          for target in CapsuleShellTests CapsuleSnapshotTests; do
            echo "== $target"
            lldb --batch \
              -o "settings set target.env-vars DYLD_FRAMEWORK_PATH=$frameworks DYLD_LIBRARY_PATH=$libraries" \
              -o run -k "thread backtrace all" -- "$helper" --test-bundle-path "$bundle" \
              --no-parallel --filter "$target" "$bundle" --testing-library swift-testing 2>&1 | tail -150 || true
          done
      - run: scripts/test-scripts.sh
      - run: scripts/release/test-signatures.sh
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: taskpolicy -b scripts/bundle-macos.sh release development
