name: Release

# Tagging is the release. `scripts/tag-release.sh` writes the tag from the
# version in Support/CapsuleApp/Info.plist, so the tag and the built app can
# never disagree.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A release that fails its own checks is worse than a late one.
      - run: swift test
      - run: scripts/test-scripts.sh
      - run: scripts/release-notes.sh --check

      # Signing and notarising are optional, and each is only set up when the
      # secrets behind it exist; without them the release is unsigned.
      - name: Prepare signing and notarising
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password=$(uuidgen)
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            # Tolerate a certificate encoded with or without line wrapping.
            printf '%s' "$MAC_CERTIFICATE" | tr -d '\n\r' | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
            echo "CAPSULE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
            echo "Developer ID certificate found: the app will be signed."
          else
            echo "::warning title=Unsigned release::No MAC_CERTIFICATE secret, so this build is unsigned. Capsule will point users at the release page for updates."
          fi
          if [ -n "$MAC_CERTIFICATE" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials capsule-notary --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
            echo "NOTARY_PROFILE=capsule-notary" >> "$GITHUB_ENV"
          else
            echo "::warning title=Not notarised::No notarisation credentials, so macOS will warn on first launch."
          fi

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifacts=$(scripts/package-macos.sh)
          scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
          version=$(scripts/version.sh)
          gh release create "v$version" $artifacts --title "Capsule $version" --notes-file "$RUNNER_TEMP/notes.md"
