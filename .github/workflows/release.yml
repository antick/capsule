name: Release

# Tagging is the release. `pnpm release:tag` writes the tag from the version in
# apps/desktop/package.json, so the tag and the built app can never disagree.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A release that fails its own checks is worse than a late one.
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and publish the macOS app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing is optional: set these three repository
          # secrets and the release is signed and notarised, so Capsule can
          # update itself in place. Without them the build is unsigned, the
          # app reports updates as manual, and the release page is the
          # install path.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE != '' }}
        run: pnpm release
