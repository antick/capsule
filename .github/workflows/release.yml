name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  macos:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # create GitHub releases and upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Validate release source
        run: python3 scripts/release/validate-source.py
      - name: Test
        run: |
          taskpolicy -b scripts/test-all.sh
          scripts/test-scripts.sh
          scripts/release/test-signatures.sh
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Prepare signing and notarization
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/release/prepare-signing.py
      - name: Build, notarize and verify
        run: taskpolicy -b scripts/package-macos.sh
      - name: Generate and verify signed update feed
        run: scripts/release/appcast.sh
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/release-artifacts/site
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(scripts/version.sh)
          scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --verify-tag --draft \
            --title "Capsule $version" --notes-file "$RUNNER_TEMP/notes.md" \
            ".build/release-artifacts/Capsule-$version-arm64.dmg" \
            ".build/release-artifacts/Capsule-$version-arm64.zip" \
            .build/release-artifacts/SHA256SUMS .build/release-artifacts/appcast.xml
          gh release edit "v$version" --draft=false --latest
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version=$(scripts/version.sh)
          python3 scripts/release/homebrew.py "$version" ".build/release-artifacts/Capsule-$version-arm64.zip"
      - name: Remove signing material
        if: always()
        run: python3 scripts/release/cleanup-signing.py

  feed:
    name: Deploy update feed
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy the Sparkle appcast to GitHub Pages
      id-token: write # request an OIDC token for the Pages deployment
    steps:
      - name: Deploy feed after release assets are public
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The landing page names this release's download, so it deploys only after
  # the release and its update feed are public.
  landing:
    name: Deploy the landing page
    needs: [macos, feed]
    permissions:
      contents: read # check out the release tag and read the latest release
    uses: $/.github/workflows/landing-deploy.yml
